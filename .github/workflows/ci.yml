name: Flutter checks and desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-preflight:
    name: Python preflight tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s engine/tests -v
      - name: Shell syntax validation
        run: bash -n scripts/build-jolven-archive.sh scripts/bootstrap.sh scripts/package-appimage.sh

  experimental-iso-smoke:
    name: Experimental synthetic ISO remaster smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools e2fsprogs libglib2.0-bin
      - name: Exercise ISO remaster with synthetic rootfs (not Nobara validation)
        run: |
          sudo env PYTHONPATH=engine python3 -m unittest discover -s engine/tests -p test_integration_remaster.py -v

  flutter-appimage:
    name: Build Flutter AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev librsvg2-bin curl
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform runner
        run: |
          flutter create --platforms=linux --project-name jolven_iso .
          rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Linux
        run: flutter build linux --release
      - name: Package AppImage
        run: bash scripts/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Jolven-ISO-Builder-Linux-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

  flutter-windows:
    name: Build Flutter Windows portable and installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Windows runner
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name jolven_iso .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package portable ZIP and setup EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Jolven-ISO-Builder-Windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish desktop artifacts for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-preflight, flutter-appimage, flutter-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Jolven-ISO-Builder-*
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
