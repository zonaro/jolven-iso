name: Flutter checks and Linux AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  python-preflight:
    name: Python preflight tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s engine/tests -v

  flutter-appimage:
    name: Build Flutter AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev librsvg2-bin curl
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform runner
        run: |
          flutter create --platforms=linux --project-name jolven_iso .
          rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Linux
        run: flutter build linux --release
      - name: Package AppImage
        run: bash scripts/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Jolven-ISO-Builder-Linux-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
